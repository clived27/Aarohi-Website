<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarohi 26 — Sponsors</title>
  <meta name="description" content="Sponsors of Aarohi 26 — Viva La Vida, VNIT Nagpur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&family=Rock+Salt&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* =====================================================
       SPONSORS PAGE — Comic / Pop-art inspired
       Dark-nightlife adaptation of the NITTFEST reference
       ===================================================== */

    body.sponsors-body {
      background: #06081a;
      color: var(--cream);
      overflow-x: hidden;
    }

    .sponsors-shell {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 120% 50% at 50% 0%, rgba(60,30,130,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 80% 100%, rgba(70,25,110,0.2) 0%, transparent 55%),
        linear-gradient(180deg, #06081a 0%, #0a0c28 100%);
    }

    .sp-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* =====================================================
       ROW 1 & ROW 2 — TITLE SPONSORS (static grid, scrollable on mobile)
       ===================================================== */

    .title-section { margin-bottom: 16px; }

    .title-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: none;
    }

    .title-row::-webkit-scrollbar { display: none; }

    /* title sponsor card */
    .ts-card {
      flex-shrink: 0;
      width: 180px;
      height: 110px;
      border-radius: 10px;
      border: 2px solid rgba(176,108,255,0.35);
      background:
        radial-gradient(circle at 50% 50%, rgba(40,20,90,0.9) 0%, rgba(14,10,40,0.97) 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .ts-card:hover {
      border-color: rgba(255,210,122,0.7);
      box-shadow:
        0 0 16px rgba(255,210,122,0.25),
        0 4px 20px rgba(0,0,0,0.5);
      transform: translateY(-3px);
    }

    .ts-card .logo-area {
      width: 60px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .ts-card .logo-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .ts-card .card-label {
      font-family: 'Poppins', sans-serif;
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(255,210,122,0.1);
      border: 1px solid rgba(255,210,122,0.3);
      padding: 1px 8px;
      border-radius: 4px;
    }

    .ts-card .card-label--silver {
      color: #c0cee0;
      background: rgba(180,200,230,0.1);
      border-color: rgba(180,200,230,0.3);
    }

    .ts-card .card-label--powered {
      color: var(--nav-glow);
      background: rgba(176,108,255,0.1);
      border-color: rgba(176,108,255,0.3);
    }

    /* =====================================================
       CENTER TITLE — "2026 SPONSORS"
       ===================================================== */

    .sp-center-title {
      text-align: center;
      padding: 48px 20px 40px;
      position: relative;
    }

    .sp-center-title h1 {
      display: inline-flex;
      align-items: center;
      gap: 0;
      line-height: 1;
    }

    .sp-year {
      display: inline-block;
      background: var(--nav-glow);
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      padding: 6px 16px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .sp-word {
      display: inline-block;
      background: #111;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      padding: 6px 22px;
      border-radius: 6px;
      margin-left: 8px;
      letter-spacing: 0.08em;
      border: 2px solid rgba(255,255,255,0.15);
    }

    .sp-subtitle {
      margin-top: 14px;
      font-family: 'Rock Salt', cursive;
      font-size: clamp(0.65rem, 1.5vw, 0.9rem);
      color: rgba(200,180,255,0.55);
      letter-spacing: 0.06em;
    }

    /* speech bubbles */
    .bubble {
      position: absolute;
      background: #fff;
      color: #111;
      font-family: 'Bangers', cursive;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      padding: 6px 14px;
      border-radius: 14px;
      border: 2px solid #333;
      white-space: nowrap;
    }

    .bubble::after {
      content: '';
      position: absolute;
      width: 0; height: 0;
      border: 8px solid transparent;
    }

    .bubble--left {
      left: 2%;
      top: 40%;
    }

    .bubble--left::after {
      bottom: -14px;
      left: 16px;
      border-top-color: #fff;
    }

    .bubble--right {
      right: 2%;
      top: 36%;
    }

    .bubble--right::after {
      bottom: -14px;
      right: 16px;
      border-top-color: #fff;
    }

    /* =====================================================
       BOTTOM MARQUEE ROWS — Partner / associate logos
       ===================================================== */

    .marquee-section {
      overflow: hidden;
      margin-bottom: 16px;
    }

    .mq-track {
      display: flex;
      gap: 14px;
      width: max-content;
      padding: 6px 0;
    }

    .mq-track--ltr { animation: mq-ltr 40s linear infinite; }
    .mq-track--rtl { animation: mq-rtl 36s linear infinite; }

    .mq-track:hover { animation-play-state: paused; }

    @keyframes mq-ltr {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes mq-rtl {
      0%   { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    /* marquee card */
    .mq-card {
      flex-shrink: 0;
      width: 150px;
      height: 80px;
      border-radius: 8px;
      border: 2px solid rgba(176,108,255,0.25);
      background:
        radial-gradient(circle at 50% 50%, rgba(50,20,100,0.7) 0%, rgba(14,10,40,0.95) 80%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .mq-card:hover {
      border-color: rgba(255,210,122,0.6);
      box-shadow: 0 0 14px rgba(255,210,122,0.2);
    }

    .mq-card .logo-area {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      padding: 10px;
    }

    .mq-card .logo-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* =====================================================
       BOTTOM NOTE
       ===================================================== */

    .sp-bottom-note {
      text-align: right;
      margin-top: 24px;
      padding-right: 8px;
    }

    .sp-bottom-note span {
      display: inline-block;
      background: var(--gold);
      color: #111;
      font-family: 'Bangers', cursive;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding: 4px 14px;
      border-radius: 4px;
      border: 2px solid rgba(0,0,0,0.15);
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 768px) {
      .sp-main { padding: 28px 10px 40px; }
      .ts-card { width: 150px; height: 95px; }
      .ts-card .logo-area { width: 48px; height: 40px; font-size: 1.6rem; }
      .mq-card { width: 120px; height: 68px; }
      .bubble { font-size: 0.55rem; padding: 4px 10px; }
    }

    @media (max-width: 480px) {
      .ts-card { width: 130px; height: 85px; }
      .mq-card { width: 100px; height: 58px; }
      .sp-center-title { padding: 32px 12px 28px; }
      .bubble { display: none; }
    }
  </style>
</head>

<body class="sponsors-body">
  <div class="sponsors-shell">

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
      <nav class="nav-inner">
        <a href="index.html" class="nav-brand" aria-label="Aarohi Home">
          <img src="assets/logo-hogo/Aarohi Hobo BW Final.png" alt="Aarohi" class="nav-logo">
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="sponsors.html" class="active">Sponsors</a></li>
          <li><a href="merch.html">Merch</a></li>
        </ul>
        <a href="passes.html" class="nav-buy-passes">BUY PASSES</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </nav>
    </header>

    <main class="sp-main">

      <!-- ===== ROW 1: TITLE SPONSORS ===== -->
      <section class="title-section">
        <div class="title-row" id="title-row-1"></div>
      </section>

      <!-- ===== ROW 2: MORE TITLE/ASSOCIATE SPONSORS ===== -->
      <section class="title-section">
        <div class="title-row" id="title-row-2"></div>
      </section>

      <!-- ===== CENTER TITLE ===== -->
      <div class="sp-center-title">
        <div class="bubble bubble--left">Aarohi is powered by heroes...</div>
        <h1>
          <span class="sp-year">2026</span>
          <span class="sp-word">SPONSORS</span>
        </h1>
        <p class="sp-subtitle">Sponsors Assemble !</p>
        <div class="bubble bubble--right">Bro... did you register yet?</div>
      </div>

      <!-- ===== MARQUEE ROW 1 (left to right) ===== -->
      <section class="marquee-section">
        <div class="mq-track mq-track--ltr" id="mq-row-1"></div>
      </section>

      <!-- ===== MARQUEE ROW 2 (right to left) ===== -->
      <section class="marquee-section">
        <div class="mq-track mq-track--rtl" id="mq-row-2"></div>
      </section>

      <!-- ===== BOTTOM NOTE ===== -->
      <div class="sp-bottom-note">
        <span>And funded by icons....</span>
      </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer merch-footer">
      <div class="footer-inner">
        <p>&copy; 2026 Aarohi, VNIT Nagpur. All rights reserved.</p>
        <ul class="footer-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="merch.html">Merch</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </div>
    </footer>

  </div>

  <script src="js/script.js"></script>
  <script>
    /* =============================================================
       SPONSOR DATA
       logoImg: path to image (e.g. "assets/sponsors/axis.png")
       logoEmoji: fallback emoji when no image
       ============================================================= */

    /* Row 1 — Title + Associate title sponsors */
    const ROW1 = [
      { logoEmoji: "\u{1f3e6}", logoImg: "", name: "Minus 2 Cents",    label: "TITLE SPONSOR",           labelClass: "" },
      { logoEmoji: "\u26a1",    logoImg: "", name: "Sponsor 2",         label: "POWERED BY",             labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f33f}", logoImg: "", name: "Hindkush",          label: "POWERED BY",             labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f355}", logoImg: "", name: "Divine Foods",      label: "POWERED BY",             labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f3e6}", logoImg: "", name: "Union Bank",        label: "ASSOCIATE TITLE SPONSOR", labelClass: "card-label--silver" },
      { logoEmoji: "\u{1f3e6}", logoImg: "", name: "Minus 2 Cents",    label: "TITLE SPONSOR",           labelClass: "" },
      { logoEmoji: "\u26a1",    logoImg: "", name: "Sponsor 2",         label: "POWERED BY",             labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f33f}", logoImg: "", name: "Hindkush",          label: "POWERED BY",             labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f355}", logoImg: "", name: "Divine Foods",      label: "POWERED BY",             labelClass: "card-label--powered" }
    ];

    /* Row 2 — More sponsors */
    const ROW2 = [
      { logoEmoji: "\u{1f3d7}", logoImg: "", name: "Bharath Groups",    label: "SPONSOR",     labelClass: "card-label--silver" },
      { logoEmoji: "\u{1f393}", logoImg: "", name: "RECAL",             label: "ALUMNI PARTNER", labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f354}", logoImg: "", name: "MyOP",              label: "SPONSOR",     labelClass: "card-label--silver" },
      { logoEmoji: "\u2764",    logoImg: "", name: "Electrified By",    label: "POWERED BY",  labelClass: "card-label--powered" },
      { logoEmoji: "\u{1f33f}", logoImg: "", name: "The Affordable",    label: "SPONSOR",     labelClass: "card-label--silver" },
      { logoEmoji: "\u{1f48a}", logoImg: "", name: "Nua",               label: "SPONSOR",     labelClass: "card-label--silver" },
      { logoEmoji: "\u{1f3d7}", logoImg: "", name: "Bharath Groups",    label: "SPONSOR",     labelClass: "card-label--silver" }
    ];

    /* Marquee Row 1 — left to right */
    const MQ1 = [
      { logoEmoji: "\u{1f3a2}", logoImg: "", name: "Wonderla" },
      { logoEmoji: "\u{1f36b}", logoImg: "", name: "Dark Fantasy" },
      { logoEmoji: "\u{1f36a}", logoImg: "", name: "Abani" },
      { logoEmoji: "\u{1f382}", logoImg: "", name: "Bingo" },
      { logoEmoji: "\u{1f33f}", logoImg: "", name: "Green Trends" },
      { logoEmoji: "\u{1f534}", logoImg: "", name: "Dawbu" },
      { logoEmoji: "\u2702",    logoImg: "", name: "Stylz" },
      { logoEmoji: "\u{1f3a2}", logoImg: "", name: "Wonderla" },
      { logoEmoji: "\u{1f36b}", logoImg: "", name: "Dark Fantasy" },
      { logoEmoji: "\u{1f36a}", logoImg: "", name: "Abani" }
    ];

    /* Marquee Row 2 — right to left */
    const MQ2 = [
      { logoEmoji: "\u00a9",    logoImg: "", name: "Coin Sponsor" },
      { logoEmoji: "\u{1f4e6}", logoImg: "", name: "Mani Mark" },
      { logoEmoji: "\u{1f48e}", logoImg: "", name: "Dee" },
      { logoEmoji: "\u{1f95b}", logoImg: "", name: "Amul" },
      { logoEmoji: "\u{1f964}", logoImg: "", name: "Coca-Cola" },
      { logoEmoji: "\u{1f4c8}", logoImg: "", name: "Stock Edge" },
      { logoEmoji: "\u{1f49a}", logoImg: "", name: "Pureheart" },
      { logoEmoji: "\u00a9",    logoImg: "", name: "Coin Sponsor" }
    ];

    /* ── Render title rows (static horizontal scroll) ── */
    function buildTitleCard(s) {
      const div = document.createElement('div');
      div.className = 'ts-card';
      div.setAttribute('aria-label', s.name);

      const logoContent = s.logoImg
        ? '<img src="' + s.logoImg + '" alt="' + s.name + '">'
        : s.logoEmoji;

      div.innerHTML =
        '<div class="logo-area">' + logoContent + '</div>' +
        '<span class="card-label ' + (s.labelClass || '') + '">' + s.label + '</span>';

      return div;
    }

    function fillTitleRow(id, data) {
      const row = document.getElementById(id);
      data.forEach(s => row.appendChild(buildTitleCard(s)));
    }

    fillTitleRow('title-row-1', ROW1);
    fillTitleRow('title-row-2', ROW2);

    /* ── Render marquee rows (doubled for loop) ── */
    function buildMarqueeCard(s) {
      const div = document.createElement('div');
      div.className = 'mq-card';
      div.setAttribute('aria-label', s.name);

      const logoContent = s.logoImg
        ? '<img src="' + s.logoImg + '" alt="' + s.name + '">'
        : s.logoEmoji;

      div.innerHTML = '<div class="logo-area">' + logoContent + '</div>';
      return div;
    }

    function fillMarquee(id, data) {
      const track = document.getElementById(id);
      const doubled = [...data, ...data];
      doubled.forEach(s => track.appendChild(buildMarqueeCard(s)));
    }

    fillMarquee('mq-row-1', MQ1);
    fillMarquee('mq-row-2', MQ2);
  </script>
</body>
</html>
