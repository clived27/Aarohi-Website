<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarohi 26 — Sponsors</title>
  <meta name="description" content="Sponsors of Aarohi 26 — Viva La Vida, VNIT Nagpur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&family=Rock+Salt&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* =====================================================
       SPONSORS PAGE — Moving Marquee Tiles
       ===================================================== */

    body.sponsors-body {
      background: #06081a;
      color: #e8d5ff;
      overflow-x: hidden;
    }

    .sponsors-shell {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 110% 55% at 50% 0%, rgba(40,28,110,0.5) 0%, transparent 65%),
        radial-gradient(ellipse 70% 45% at 85% 100%, rgba(70,25,110,0.28) 0%, transparent 60%),
        linear-gradient(180deg, #06081a 0%, #080c24 50%, #06081a 100%);
    }

    /* ---- Sparse page title ---- */
    .sp-title-bar {
      padding: 46px 32px 32px;
      text-align: center;
    }

    .sp-title-bar h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(180, 150, 255, 0.55);
      font-weight: 600;
    }

    /* =====================================================
       MARQUEE STAGE
       ===================================================== */

    .marquee-stage {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 0 0 80px;
      overflow: hidden;
    }

    /* each row */
    .mq-row {
      display: flex;
      width: max-content;
      gap: 20px;
      padding: 8px 0;
    }

    /* row 1 — left */
    .mq-row--ltr { animation: mq-ltr 38s linear infinite; }
    /* row 2 — right */
    .mq-row--rtl { animation: mq-rtl 34s linear infinite; }
    /* row 3 — left, slightly faster */
    .mq-row--ltr2 { animation: mq-ltr 28s linear infinite; }

    @keyframes mq-ltr {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes mq-rtl {
      0%   { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    /* pause on hover */
    .mq-row:hover { animation-play-state: paused; }

    /* ---- individual tile ---- */
    .mq-tile {
      flex-shrink: 0;
      width: 160px;
      height: 120px;
      background: rgba(14, 16, 50, 0.92);
      border: 1px solid rgba(100, 70, 200, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .mq-tile:hover {
      border-color: rgba(160, 100, 255, 0.6);
      box-shadow: 0 0 24px rgba(120, 60, 240, 0.3);
      z-index: 2;
    }

    /* random clip-path shapes — assigned via class */
    .shape-0  { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%); }                           /* rectangle */
    .shape-1  { clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%); }                            /* parallelogram right */
    .shape-2  { clip-path: polygon(0% 0%, 92% 0%, 100% 100%, 8% 100%); }                            /* parallelogram left */
    .shape-3  { clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); }                           /* trapezoid wider bottom */
    .shape-4  { clip-path: polygon(0% 0%, 100% 0%, 90% 100%, 10% 100%); }                           /* trapezoid wider top */
    .shape-5  { clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%); }                            /* slight parallelogram */
    .shape-6  { clip-path: polygon(0% 6%, 100% 0%, 100% 94%, 0% 100%); }                            /* vertical tilt */
    .shape-7  { clip-path: polygon(0% 0%, 100% 6%, 100% 100%, 0% 94%); }                            /* vertical tilt reverse */

    /* logo image fills the tile */
    .mq-tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 16px;
      display: block;
    }

    /* emoji fallback (when no real logo yet) */
    .mq-tile .logo-emoji {
      font-size: 2.8rem;
      line-height: 1;
      user-select: none;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */
    @media (max-width: 640px) {
      .mq-tile { width: 120px; height: 90px; }
      .mq-tile .logo-emoji { font-size: 2rem; }
      .marquee-stage { gap: 18px; }
    }
  </style>
</head>

<body class="sponsors-body">
  <div class="sponsors-shell">

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
      <nav class="nav-inner">
        <a href="index.html" class="nav-brand" aria-label="Aarohi Home">
          <img src="assets/logo-hogo/Aarohi Hobo BW Final.png" alt="Aarohi" class="nav-logo">
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="sponsors.html" class="active">Sponsors</a></li>
          <li><a href="merch.html">Merch</a></li>
        </ul>
        <a href="passes.html" class="nav-buy-passes">BUY PASSES</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </nav>
    </header>

    <!-- sparse label -->
    <div class="sp-title-bar">
      <h1>Sponsors &amp; Partners</h1>
    </div>

    <!-- ===== MARQUEE STAGE ===== -->
    <div class="marquee-stage" aria-label="Sponsor logos">
      <div class="mq-row mq-row--ltr"  id="row-1"></div>
      <div class="mq-row mq-row--rtl"  id="row-2"></div>
      <div class="mq-row mq-row--ltr2" id="row-3"></div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer merch-footer">
      <div class="footer-inner">
        <p>&copy; 2026 Aarohi, VNIT Nagpur. All rights reserved.</p>
        <ul class="footer-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="merch.html">Merch</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </div>
    </footer>

  </div>

  <script src="js/script.js"></script>
  <script>
    /* =============================================================
       SPONSOR DATA
       logoImg: path to image file (e.g. "assets/sponsors/axis.png")
       logoEmoji: emoji fallback shown until real image is added
       ============================================================= */
    const SPONSORS = [
      // ── Title / Platinum ──
      { logoImg: "", logoEmoji: "🏦", alt: "Axis Bank" },
      { logoImg: "", logoEmoji: "💊", alt: "Dr. Reddys" },
      { logoImg: "", logoEmoji: "💻", alt: "Infosys" },
      { logoImg: "", logoEmoji: "🌐", alt: "TCS" },
      { logoImg: "", logoEmoji: "🐂", alt: "Red Bull" },
      { logoImg: "", logoEmoji: "📦", alt: "Amazon" },
      // ── Partners ──
      { logoImg: "", logoEmoji: "🍕", alt: "Zomato" },
      { logoImg: "", logoEmoji: "🛵", alt: "Swiggy" },
      { logoImg: "", logoEmoji: "🎧", alt: "boAt" },
      { logoImg: "", logoEmoji: "💳", alt: "Cred" },
      { logoImg: "", logoEmoji: "💄", alt: "Nykaa" },
      { logoImg: "", logoEmoji: "⌚", alt: "Noise" },
      { logoImg: "", logoEmoji: "🎬", alt: "Jio Cinema" },
      { logoImg: "", logoEmoji: "📚", alt: "Classplus" },
      { logoImg: "", logoEmoji: "🎓", alt: "Internshala" },
      { logoImg: "", logoEmoji: "📰", alt: "Times of India" }
    ];

    const SHAPES = ['shape-0','shape-1','shape-2','shape-3','shape-4','shape-5','shape-6','shape-7'];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildTile(s, idx) {
      const shape = SHAPES[idx % SHAPES.length];
      const div = document.createElement('div');
      div.className = `mq-tile ${shape}`;
      div.setAttribute('aria-label', s.alt);

      if (s.logoImg) {
        div.innerHTML = `<img src="${s.logoImg}" alt="${s.alt}">`;
      } else {
        div.innerHTML = `<span class="logo-emoji" aria-hidden="true">${s.logoEmoji}</span>`;
      }
      return div;
    }

    function fillRow(rowId, sponsors) {
      const row = document.getElementById(rowId);
      // double the set for seamless loop
      const doubled = [...sponsors, ...sponsors];
      doubled.forEach((s, i) => row.appendChild(buildTile(s, i)));
    }

    // each row gets a different shuffled order
    fillRow('row-1', shuffle(SPONSORS));
    fillRow('row-2', shuffle(SPONSORS));
    fillRow('row-3', shuffle(SPONSORS));
  </script>
</body>
</html>
